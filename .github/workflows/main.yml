name: C++ CI

on:
  push:           # автозапуск при каждом push
  pull_request:   # автозапуск на PR

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]  # gcc и clang с самого начала
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ clang

      - name: Configure (CMake)
        run: |
          if [ "${{ matrix.compiler }}" = "clang" ]; then
            export CXX=clang++
          else
            export CXX=g++
          fi
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER="$CXX"

      - name: Build
        run: cmake --build build --parallel

      - name: Run Tests
        run: |
          cd build
          echo "=== Запуск всех тестов через CTest ==="
          ctest --output-on-failure --verbose
          
          echo "=== Запуск модульных тестов ==="
          ./test_basic_operations
          ./test_advanced_operations
          
          echo "=== Запуск интеграционных тестов ==="
          ./test_eval_line
          
          echo "=== Запуск тестов граничных случаев ==="
          ./test_boundary_conditions
          
          echo "=== Все тесты завершены успешно! ==="
